<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鴨王戦 予選レート戦</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #e2e0d8;
  --accent: #1f6f50; --accent-ink: #ffffff; --accent-soft: #e3f1ea;
  --t1: #2a5db0; --t1-soft: #e6eefb; --t2: #b5482a; --t2-soft: #fbebe5;
  --win: #1f7a3f; --lose: #b3261e; --warn: #8a5a00; --warn-soft: #fff4d6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 15px; line-height: 1.5; }
header { background: var(--accent); color: var(--accent-ink); padding: 14px 16px 10px; }
header { position: relative; }
header h1 { padding-right: 112px; }
header .sub { padding-right: 64px; }
.hbtns { position: absolute; top: 10px; right: 12px; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.hrow { display: flex; gap: 6px; }
.reloadbtn { background: transparent; color: var(--accent-ink); border: 1px solid currentColor; opacity: .7; border-radius: 8px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
.reloadbtn:disabled { opacity: .4; cursor: default; }
.reloadbtn .ri { display: inline-block; }
.reloadbtn.busy .ri { animation: rspin .8s linear infinite; }
@keyframes rspin { to { transform: rotate(360deg); } }
.adminbtn { background: transparent; color: var(--accent-ink); border: 1px solid currentColor; opacity: .7; border-radius: 8px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
.adminbtn.on { opacity: 1; background: rgba(255,255,255,.15); }
header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
nav { display: flex; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; overflow-x: auto; }
nav button { flex: 1; min-width: 64px; white-space: nowrap; border: 0; background: none; padding: 12px 6px; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; }
nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 60px; }
.logday { display: flex; justify-content: space-between; align-items: baseline; margin: 16px -14px 8px; padding: 6px 14px; background: rgba(120,120,140,.12); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 15px; }
details.logdays:first-of-type .logday { margin-top: 4px; }
details.logdays summary.logday { cursor: pointer; list-style: none; -webkit-tap-highlight-color: transparent; }
details.logdays summary.logday::-webkit-details-marker { display: none; }
details.logdays summary.logday b::before { content: '▸'; display: inline-block; width: 1.1em; color: var(--muted); }
details.logdays[open] summary.logday b::before { content: '▾'; }
details.logdays:not([open]) summary.logday { margin-bottom: 0; }
details.logdays:not([open]) + details.logdays summary.logday { margin-top: -1px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 10px; }
.muted { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.zone td { background: var(--accent-soft); }
tr.cut td { border-bottom: 3px solid var(--accent); }
.scroll { overflow-x: auto; }
a { color: var(--accent); text-decoration: none; font-weight: 600; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line); color: var(--ink); margin-left: 4px; }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.award { border-top: 1px solid var(--line); padding: 8px 0; }
.award .ahead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 4px; }
.award .ahead .muted { font-size: 12px; }
.arow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 3px 0; font-size: 15px; }
.arank { display: inline-block; min-width: 3.2em; font-size: 13px; color: var(--muted); }
.arank.r1 { color: #b07a00; font-weight: 700; }
.arow.prov .arank, .arow.prov .aval { opacity: .75; }
.amore summary { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin: 6px 0 2px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; background: var(--card); list-style: none; user-select: none; }
.amore summary:active { opacity: .7; }
.amore summary::-webkit-details-marker { display: none; }
.amore summary::after { content: ''; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); }
.amore[open] summary::after { transform: translateY(2px) rotate(-135deg); }
.amore[open] summary { margin-bottom: 4px; }
.amore .when-open, .amore[open] .when-closed { display: none; }
.amore[open] .when-open { display: inline; }
.cancelrow { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); text-align: center; }
.cancelrow p { margin: 4px 0 0; font-size: 12px; }
.aval { margin-left: auto; font-variant-numeric: tabular-nums; }
.adet { flex-basis: 100%; font-size: 12px; padding-left: 3.6em; }
.badge.award-b { background: #fff1c9; color: #6b4a00; margin: 2px 4px 2px 0; font-size: 12px; padding: 2px 8px; border: 1px solid transparent; }
/* 特別賞のバッジ: 1位 金・2位 銀・3位 銅・メモリアル 青。暫定は点線の枠 */
.badge.award-b.r1 { background: #fde68a; color: #6b4a00; border-color: #e0b100; }
.badge.award-b.r2 { background: #e5e7eb; color: #374151; border-color: #9ca3af; }
.badge.award-b.r3 { background: #f3d2b5; color: #6b3a12; border-color: #c2814d; }
.badge.award-b.r0 { background: #dbeafe; color: #1e3a8a; border-color: #93c5fd; }
.badge.award-b.prov { border-style: dashed; opacity: .85; }
.stat small { display: block; font-size: 12px; font-weight: 400; }
.stat.stat2 { grid-template-columns: 1fr 1fr; row-gap: 12px; }
.ebrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.ebrow .ebpt { margin-left: auto; color: var(--win); }
.ebrow .ebnext { flex-basis: 100%; font-size: 12px; }
.ebrow.tap { cursor: pointer; }
.ebtog { font-size: 12px; white-space: nowrap; }
.eblist { padding: 4px 0 10px; }
.chip.off { opacity: .6; border-style: dashed; }
.rktable th, .rktable td { padding-left: 4px; padding-right: 4px; }
.rkbonus { color: var(--win); }
.heroproj { font-size: 13px; margin-top: 2px; }
.heroproj b { color: var(--win); }
.ba { font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.4; margin-top: 2px; font-variant-numeric: tabular-nums; }
.ba span { margin-right: 10px; white-space: nowrap; }
.hm { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
.hm.void { opacity: .6; }
.hmhead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.hmhead .badge { font-size: 11px; padding: 1px 6px; }
.hmhead .sclink { margin-left: auto; }
.hmvs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: start; }
.hmside { min-width: 0; }
.hmside.t2 { text-align: right; }
.hmside .ba span { display: block; margin-right: 0; }
.ba .vba { color: var(--accent); white-space: normal; }
.ba .vba i { font-style: normal; white-space: nowrap; display: inline-block; }
.hmname { font-size: 15px; }
.hmside.t1 .hmname { color: var(--t1); } .hmside.t2 .hmname { color: var(--t2); }
.hmside.win .hmname { font-weight: 800; }
.hmside.lose .hmname { opacity: .55; }
.hmmid { text-align: center; padding-top: 2px; }
.hmlegs { font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.1; }
.hmlegs b { font-weight: 800; }
.hmlegs span { font-weight: 500; color: var(--muted); }
.hmlegs i { font-style: normal; color: var(--muted); margin: 0 4px; font-size: 16px; }
.hmsetsc { margin-top: 3px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
.hmsetsc span { display: block; white-space: nowrap; }
.hmdelta { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.hmdelta.up { color: var(--win); } .hmdelta.down { color: var(--lose); }
.hmsets { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.sclink { font-size: 13px; white-space: nowrap; margin-left: 6px; }
.sctabs { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
.sctabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.sctabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sctwrap { margin-top: 6px; }
.sctwrap.live { max-height: 300px; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
.sctitle { font-weight: 700; margin: 12px 0 4px; font-size: 14px; }
.sct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
.sct th, .sct td { border: 1px solid #9aa19d; text-align: center; padding: 3px 1px; white-space: normal; }
.sct thead th { background: var(--card); font-size: 12px; font-weight: 600; position: sticky; top: 0; z-index: 1; box-shadow: inset 0 0 0 999px rgba(120,120,140,.12); }
.sct thead tr:first-child th { font-size: 13px; font-weight: 700; height: 25px; }
.sct thead tr:nth-child(2) th { top: 25px; }
.sct col.tcol { width: 1.8em; }
.sct col.totcol { width: 2.4em; }
.sct th.tsep, .sct td.tsep { border-left: 3px double #9aa19d; }
.sct th.pname { vertical-align: top; padding: 4px 0; font-size: 12px; line-height: 1.15; }
.sct th.pnone { font-size: 11px; }
.sct td.tno { color: var(--muted); font-size: 12px; }
.sct tbody tr:nth-child(even) td { background: rgba(120,120,120,.08); }
.sct td.pt { font-size: 15px; }
.sct td.tot { font-size: 17px; font-weight: 800; }
.sct td.tot small { display: block; font-size: 10px; font-weight: 600; }
.sct tbody tr td.c-ok { background: rgba(59,130,246,.20); }
.sct tbody tr td.c-m1 { background: rgba(234,179,8,.30); }
.sct tbody tr td.c-m2 { background: rgba(239,68,68,.28); }
.sct tbody tr td.c-out { background: rgba(153,27,27,.55); color: #fff; }
.sct tbody tr td.c-bust { background: rgba(249,115,22,.35); }
.sct tbody tr td.c-win { background: rgba(34,197,94,.35); }
.sclegend { font-size: 11px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.sclegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 2px; vertical-align: -1px; }
.ebrow.ebtotal { font-weight: 700; }
.mepick { display: grid; gap: 8px; }
.mepick input, .mepick select { width: 100%; }
.hero { border: 2px solid var(--accent); }
.herotop { font-size: 13px; }
.heroname { font-size: 20px; font-weight: 800; margin: 2px 0 2px; }
.herorate b { font-size: 24px; color: var(--accent); font-variant-numeric: tabular-nums; }
.herobadges { margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; }
.tile span { display: block; font-size: 11px; }
.tile b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; margin: 1px 0; }
.tile small { display: block; font-size: 10px; }
.tile.win b { color: var(--win); } .tile.lose b { color: var(--lose); }
.setbd { margin-bottom: 4px; }
.setbd .setrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; text-align: center; }
.setrow span { display: block; font-size: 13px; font-weight: 700; }
.setrow b { font-size: 20px; }
.setrow .win span { color: var(--win); } .setrow .lose span { color: var(--lose); }
.setrow .soft span { opacity: .75; }
.qtitle { margin-bottom: 4px; }
.recent .rrow { display: grid; grid-template-columns: auto auto 1fr auto; gap: 2px 8px; align-items: baseline; padding: 8px 6px; border-top: 1px solid var(--line); }
.recent .rrow.lost { background: color-mix(in srgb, var(--lose) 6%, transparent); }
.rdate { font-size: 12px; } .rres { font-weight: 700; }
.rvs small { display: block; }
.rsets { grid-column: 2 / 4; font-size: 13px; font-variant-numeric: tabular-nums; }
.rdelta { grid-column: 4; grid-row: 1 / 3; font-weight: 700; text-align: right; }
.rdelta small { display: block; font-weight: 400; font-size: 12px; white-space: nowrap; }
details.sec summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::before { content: '▸ '; color: var(--muted); }
details.sec[open] summary::before { content: '▾ '; }
details.sec[open] summary { margin-bottom: 8px; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.btn { display: inline-block; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 10px; font-size: 15px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--lose); background: transparent; color: var(--lose); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.team { border-radius: 10px; padding: 10px; min-height: 76px; }
.team.t1 { background: var(--t1-soft); border: 1px solid var(--t1); }
.team.t2 { background: var(--t2-soft); border: 1px solid var(--t2); }
.team h3 { margin: 0 0 6px; font-size: 13px; }
.team.t1 h3 { color: var(--t1); } .team.t2 h3 { color: var(--t2); }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin: 2px; font-size: 13px; cursor: pointer; }
button.teambox { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 100%; text-align: left; border: 2px dashed transparent; cursor: pointer; font: inherit; color: inherit; min-height: 96px; }
button.teambox:active { filter: brightness(.95); }
.tbname { font-size: 15px; padding: 2px 0; }
.tbname .muted { font-size: 12px; }
.tbempty { color: var(--muted); font-size: 14px; padding: 14px 0; text-align: center; }
.tplist { display: flex; flex-direction: column; gap: 5px; padding-bottom: 76px; }
.tprow { display: grid; grid-template-columns: 1.5em 1fr auto; align-items: center; gap: 2px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; background: var(--card); color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; min-height: 40px; }
.tprow .muted { font-size: 12px; }
.tpname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tprow.on { border-width: 2px; font-weight: 700; }
.tprow.on.t1 { border-color: var(--t1); background: color-mix(in srgb, var(--t1) 12%, var(--card)); }
.tprow.on.t2 { border-color: var(--t2); background: color-mix(in srgb, var(--t2) 12%, var(--card)); }
.tprow:disabled { opacity: .45; cursor: default; }
.tpno { font-weight: 700; color: var(--muted); }
.tpfoot { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); z-index: 15; }
.tpfoot .btn { max-width: 720px; margin: 0 auto; display: block; width: 100%; min-height: 52px; font-size: 18px; font-weight: 700; }
.preview { background: var(--bg); border-radius: 10px; padding: 10px; font-size: 14px; margin: 8px 0; }
.up { color: var(--win); font-weight: 700; } .down { color: var(--lose); font-weight: 700; }
input[type=search], input[type=number], input[type=password], select { font-size: 15px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
input[type=number] { width: 80px; }
.match { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.match .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.match .side { font-size: 14px; }
.match .side.t1 { color: var(--t1); } .match .side.t2 { color: var(--t2); text-align: right; }
.match .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.match.tap { cursor: pointer; }
.match.tap:active { background: var(--line); }
.tapfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.tapgo { font-size: 14px; font-weight: 600; color: var(--t1); }
.match.ops { margin-top: 16px; border-style: dashed; }
.match.ops h3 { margin: 0 0 4px; font-size: 15px; }
.match.ops p { font-size: 12px; margin: 0 0 8px; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.res label { font-size: 12px; color: var(--muted); display: block; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; display: none; }
.toast.err { background: var(--lose); color: #fff; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar.done > i { background: var(--win, var(--accent)); }
.quota { margin: 8px 0; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.short { color: var(--lose); }
.met { color: var(--win); }
.met small { font-size: 11px; margin-left: 1px; }
.minbox { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; font-size: 14px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
svg.chart { width: 100%; height: auto; display: block; }
.daydelta { margin-top: 12px; }
.daydelta table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 14px; font-variant-numeric: tabular-nums; }
.daydelta th { font-weight: 400; color: var(--muted); font-size: 12px; text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.daydelta td { padding: 6px; border-bottom: 1px solid var(--line); }
.daydelta .num { text-align: right; }
.rksort button { padding: 6px 10px; font-size: 13px; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
/* スコア入力 */
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); color: var(--accent); padding: 8px 12px; font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.opt { margin: 10px 0; display: grid; gap: 10px; }
.chip .mini { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 4px; cursor: pointer; }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.board .tb { border-radius: 10px; padding: 10px; text-align: center; border: 2px solid transparent; }
.board .tb.t1 { background: var(--t1-soft); } .board .tb.t2 { background: var(--t2-soft); }
.board .tb.turn.t1 { border-color: var(--t1); } .board .tb.turn.t2 { border-color: var(--t2); }
.board .big { font-size: 40px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.board .legs { font-size: 13px; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0; font-size: 30px; line-height: 1; height: 34px; align-items: center; }
.dots span { width: 30px; text-align: center; color: var(--line); }
.dots .x { color: var(--lose); font-weight: 900; }
.nextbar { margin: 10px 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 15px; text-align: center; }
.points { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 12px; }

<script>
/* 外部（GitHub Pages など）に置く場合は、Apps Script ウェブアプリの URL をここに入れる。
   Apps Script から直接開く場合は空のままでよい。 */
var API_URL = '';
/* 観戦用ページ（見るだけ）。GitHub Pages の …/watch/ を書き出すときだけ true になる（観戦用リンク 設計書） */
var VIEW_ONLY = false;

var S = null;          // サーバーから受け取った状態
var tab = 'rank';
var listOpen = {}; // 個人ページの「組んだ人・戦った相手」の一覧を開いているか
var pick = { 1: [], 2: [] };
var filter = '';
var meView = '', meFilter = '', meAllMatches = false;
var rankSort = 'total'; // ランキングの並び（total: 合計順 / rating: レート順）
var logOpen = {}; // 履歴タブの日ごとの開閉（日付 → 開いているか）
var adminKey = '';
var startOpts = { scoring: 'throws', use_order: true, first_team: null }; // 標準は1投ごとの記録（個人の投擲順あり）。結果だけ入力は予備
var startStep = 1; // 試合開始: 1=メンバーを選ぶ、2=投擲順と先攻を決める（設計書 18.2）
var scoringId = null;      // スコア入力中の試合
var LC = {};               // 端末内の記録 { mid: { throws, leg3_first, leg_orders, base_rev, ver, sentVer, takeover, conflict, confirmEnd, draft } }
var manualOpen = {};
var watchId = null, watchData = null, watchAt = 0, watchErr = false, watchTimer = null, takeArm = null; // 観戦中の試合（設計書 第21章）
var WATCH_MS = 5000; // 観戦の更新間隔
var syncing = false, syncTimer = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

// 観戦用ページで呼んでよい読み取りの API。これ以外（試合の開始・記録・日程・運営）は送らずに止める
var VIEW_READ = { state: 1, matchThrows: 1, watch: 1 };
function call(action, payload) {
  payload = payload || {};
  if (VIEW_ONLY && !VIEW_READ[action]) return Promise.reject(new Error('観戦用のページでは記録できません'));
  if (window.google && google.script && google.script.run) {
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (r) {
        if (r && r.ok) res(r.data);
        else rej(new Error(r ? r.error : '通信エラー（サーバーからの応答が空でした。Apps Script を最新版に貼り替えて「新バージョン」でデプロイし直してください）'));
      }).withFailureHandler(function (e) { rej(new Error('通信エラー: ' + (e && e.message ? e.message : e))); }).api(action, payload);
    });
  }
  var url = API_URL || window.KAMO_API_URL;
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r.ok) throw new Error(r.error); return r.data; });
}

/* ---- レート計算（サーバーと同じ式。見込み表示用） ---- */
function roundHalfUp(v) { var x = Math.round(v * 1e6) / 1e6; return x >= 0 ? Math.floor(x + 0.5) : -Math.floor(-x + 0.5); }
function n(v, d) { var x = Number(v); return v === '' || v === null || v === undefined || isNaN(x) ? d : x; }
function computeDelta(winAvg, loseAvg, c) {
  c = c || {};
  var gain = roundHalfUp(n(c.win_base, 24) + (loseAvg - winAvg) * n(c.win_coef, 0.06));
  var loss = roundHalfUp(n(c.loss_base, 20) + (loseAvg - winAvg) * n(c.loss_coef, 0.05));
  return { gain: Math.max(n(c.min_gain, 10), gain), loss: Math.max(n(c.min_loss, 10), loss) };
}

/* ENGINE START — 1投ごとのスコア計算（Code.gs と index.html に同じものが入る。編集は engine.js で行い、node test/build.js で反映） */
/**
 * 投擲の列を最初から再生して、試合の現在の状態を返す。
 * match: {
 *   team1, team2: [選手ID...]（1セット目の投擲順）, first_team: 1|2（1セット目の先攻）,
 *   use_order: 個人の投擲順を入れるか, leg3_first: 1|2|null（3セット目の先攻）,
 *   leg_orders: [[team1順, team2順], ...]（セットごとの投擲順。1セット目は省略可）
 * }
 * throws: [{ kind: 'normal'|'miss'|'foul', points: 1〜12 }]（投げた人・チームは順番から自動で決まる）
 *   points の代わりに pins: [倒れたピンの番号...] でも受け付ける（1本ならその数字、2本以上なら本数）
 */
function molkkyReplay(match, throws) {
  var first = Number(match.first_team) === 2 ? 2 : 1;
  var st = {
    leg: 1, legsWon: [0, 0], scores: [0, 0], misses: [0, 0], legScores: [], totals: [0, 0],
    legFirst: first, turn: first, playerIdx: [0, 0], finished: false, winner: null,
    needSetup: false, needFirst: false, needOrder: false, leg3Chooser: null,
    orders: [], log: [], error: null
  };
  var teams = [match.team1 || [], match.team2 || []];
  function orderFor(leg) {
    var lo = match.leg_orders && match.leg_orders[leg - 1];
    if (lo && lo[0] && lo[0].length && lo[1] && lo[1].length) return [lo[0].slice(), lo[1].slice()];
    if (leg === 1 || (teams[0].length <= 1 && teams[1].length <= 1)) return [teams[0].slice(), teams[1].slice()]; // 個人戦は選び直し不要
    return null;
  }
  function startLeg() {
    st.needSetup = st.needFirst = st.needOrder = false;
    st.scores = [0, 0]; st.misses = [0, 0]; st.playerIdx = [0, 0];
    if (st.leg === 1) st.legFirst = first;
    else if (st.leg === 2) st.legFirst = 3 - first; // 2セット目は1セット目の後攻チームが先攻
    else {
      // 3セット目: 2セット目終了時点の総得点が高いチームが先攻を選ぶ（同点はドローショット）
      st.leg3Chooser = st.totals[0] > st.totals[1] ? 1 : st.totals[1] > st.totals[0] ? 2 : 0;
      if (match.leg3_first === 1 || match.leg3_first === 2) st.legFirst = match.leg3_first;
      else { st.legFirst = null; st.needFirst = true; }
    }
    var o = orderFor(st.leg);
    if (match.use_order && st.leg > 1 && !o) st.needOrder = true; // 2セット目以降は投擲順を選び直す
    var prev = st.orders[st.leg - 2] || [teams[0].slice(), teams[1].slice()];
    if (!o && st.leg === 2) prev = [prev[0].slice().reverse(), prev[1].slice().reverse()]; // 2セット目のチーム内の投擲順は、1セット目の逆順を初期値にする
    st.orders[st.leg - 1] = o || prev;
    st.needSetup = st.needFirst || st.needOrder;
    st.turn = st.legFirst;
  }
  function nextPlayer(team) {
    if (!match.use_order) return '';
    var list = st.orders[st.leg - 1][team - 1];
    return list.length ? list[st.playerIdx[team - 1] % list.length] : '';
  }
  function endLeg(winTeam) {
    st.legsWon[winTeam - 1]++;
    st.legScores.push([st.scores[0], st.scores[1]]);
    st.totals[0] += st.scores[0]; st.totals[1] += st.scores[1];
    if (st.legsWon[winTeam - 1] >= 2) { st.finished = true; st.winner = winTeam; return; }
    st.leg++;
    startLeg();
  }
  startLeg();
  for (var i = 0; i < throws.length; i++) {
    var t = throws[i] || {};
    if (st.finished) { st.error = '試合はすでに終わっています（' + (i + 1) + '投目）'; break; }
    if (st.needSetup) { st.error = st.leg + 'セット目の' + (st.needFirst ? '先攻' : '投擲順') + 'が決まっていません'; break; }
    var team = st.turn, k = team - 1;
    var pins = (t.pins || []).map(Number).filter(function (p) { return p >= 1 && p <= 12 && p % 1 === 0; });
    var given = Number(t.points);
    var hasPoints = given >= 1 && given <= 12 && given % 1 === 0;
    if (t.kind === 'normal' && t.points !== undefined && t.points !== null && !hasPoints) { st.error = '得点は1〜12で入力してください（' + (i + 1) + '投目）'; break; }
    var kind = t.kind === 'foul' ? 'foul' : (t.kind === 'miss' || (!hasPoints && pins.length === 0) ? 'miss' : 'normal');
    if (kind !== 'normal' || hasPoints) pins = [];
    var seen = {};
    for (var j = 0; j < pins.length; j++) { if (seen[pins[j]]) { st.error = '同じピンが2回あります'; break; } seen[pins[j]] = 1; }
    if (st.error) break;
    var points = kind !== 'normal' ? 0 : hasPoints ? given : (pins.length === 1 ? pins[0] : pins.length);
    var rec = { leg: st.leg, team: team, player: nextPlayer(team), kind: kind, pins: pins, points: points, event: '' };
    if (kind === 'normal') {
      st.misses[k] = 0;
      var sc = st.scores[k] + points;
      if (sc > 50) { sc = 25; rec.event = 'bust'; } // 50を超えたらバースト（25点に戻る）
      st.scores[k] = sc;
      if (sc === 50) rec.event = 'win';
    } else {
      st.misses[k]++;
      if (st.misses[k] >= 3) { rec.event = 'out'; st.scores[k] = 0; } // 3回連続ミスで失格。失格したチームは0点
    }
    rec.score_after = st.scores[k]; rec.miss_streak = st.misses[k];

function vsFixedCount(id) { return (S.vs_fixed || {})[id] || { solo: 0, singles: 0 }; }
function vsFixedOver() {
  var lim = vsFixedLimits(), out = [];
  [1, 2].forEach(function (t) {
    var me = pick[t], opp = pick[3 - t];
    if (!(me.length === 1 && P(me[0]).fixed)) return;
    opp.forEach(function (id) {
      if (P(id).fixed) return;
      var c = vsFixedCount(id);
      if (c.solo >= lim.solo) out.push({ name: P(id).name, singles: false });
      else if (opp.length === 1 && c.singles >= lim.singles) out.push({ name: P(id).name, singles: true });
    });
  });
  return out;
}
function startPreview() {
  if (!(pick[1].length && pick[2].length)) return '';

  var h = '<div class="preview">平均レート チーム1 <b>' + av(1) + '</b> ／ チーム2 <b>' + av(2) + '</b>' +
    (teamed ? '<div class="muted">鴨王がほかの人と組むときは、鴨王の参考レートで平均を出します</div>' : '') + '</div>';
  if (singlesFull()) h += '<div class="warnbox">この2人の1vs1は上限の' + n(S.settings.max_singles_vs_same, 3) + '試合に達しています</div>';

    h += '<div class="warnbox">' + esc(o.name) + ' さんは' + (o.singles ? '鴨王との1vs1が上限の' + lim.singles + '試合に達しています（鴨王1人vs複数、鴨王がほかの人と組む試合はできます）'
      : '鴨王が1人のチームとの対戦（1vs1・鴨王1人vs複数）が上限の' + lim.solo + '試合に達しています（鴨王がほかの人と組む試合はできます）') + '</div>';
  });
  return h;
}

/* ---- ルール（観戦用ページはタブ、参加者用はヘッダーのルールボタン。観戦用リンク 設計書 9章）: 参加していない人向けのルールの概要。数字は settings から ---- */
function viewRule() {

    '<li>同じ相手との個人戦（1対1）は' + maxSingles + '試合まで。</li>' +
    (boss.length ? '<li>鴨王が1人のチーム（1対1・鴨王1人対複数）との対戦は1人' + n(s.max_vs_fixed_solo, 5) + '試合まで、そのうち1対1は' + n(s.max_vs_fixed_singles, 3) + '試合まで。鴨王がほかの人と組んだ試合は何試合でもできます。</li>' : '') +
    '<li>順位は<b>合計（レート＋ボーナス）</b>の順。最低条件を満たした人の上位' + q + '名が通過で、ランキングの色付きの行が今の時点の通過圏内です。</li></ul>');

    bh += '<p>' + fixedR + 'で計算する対戦（鴨王が1人のチーム: 1対1・鴨王1人対複数）は、<b>1人' + n(s.max_vs_fixed_solo, 5) + '試合まで</b>（そのうち1対1は' + n(s.max_vs_fixed_singles, 3) + '試合まで）です。鴨王がほかの人と組んだ試合は何試合でもできます。</p>';

/* ---- 観戦（設計書 第21章）: 読み取りだけ。記録中の端末には何も送らない ---- */
function curWatch() { return watchData && watchData.id === watchId ? watchData : findM(watchId); }
function openWatch(mid) {
  watchId = mid; watchData = null; watchAt = 0; watchErr = false; takeArm = null; cancelArm = null; scoreSel = null;
  render(); window.scrollTo(0, 0);
  pollWatch();
}
function closeWatch() { watchId = null; watchData = null; takeArm = null; clearTimeout(watchTimer); }
function pollWatch() {
  clearTimeout(watchTimer);
  var id = watchId, m0 = curWatch();
  if (!id || !m0 || m0.scoring !== 'throws') return; // 結果だけ入力の試合は見るものがないので読み込まない
  var next = function () { if (watchId === id) watchTimer = setTimeout(pollWatch, WATCH_MS); };
  if (document.visibilityState !== 'visible' || syncing) { next(); return; }
  call('watch', { match_id: id }).then(function (d) {
    if (watchId !== id) return;
    watchData = d.match; watchAt = Date.now(); watchErr = false;
    if (d.match.status !== 'playing') { call('state').then(function (st) { S = st; watchRender(); }).catch(function () {}); } // 終わった・取り消された: ランキングなども読み直す（以後は更新しない）
    else next();
    watchRender();
  }).catch(function () { if (watchId !== id) return; watchErr = true; watchRender(); next(); });
}
// 入力中（結果だけ入力の欄など）は描き直さない
function watchRender() { if ((tab === 'play' || tab === 'live') && watchId && !scoringId && !document.activeElement.matches('input,select')) render(); }

function scoreBoard(st, m) {
  return '<div class="board">' + [1, 2].map(function (t) {

}

function queueSync(now) { clearTimeout(syncTimer); syncTimer = setTimeout(doSync, now ? 0 : 700); }

function doSync() {
  var mid = scoringId || Object.keys(LC).filter(function (k) { return LC[k].ver > LC[k].sentVer; })[0];
  if (!mid || !LC[mid]) return;

  // 試合が終わる投擲は「この結果で確定」を押すまで送らない（最後の入力ミスを直せるように）

    .then(function (data) {

// st: molkkyReplay の結果、m: 試合（team1/team2/use_order）、leg: 表示するセット
function scoreTable(st, m, leg, live) {
  var L = st.log.filter(function (r) { return r.leg === leg; });
  var first = L.length ? L[0].team : (st.legFirst || 1);
  var cols = [first, 3 - first], rows = [];
  L.forEach(function (r) { if (r.team === first || !rows.length) rows.push({}); rows[rows.length - 1][r.team] = r; });
  var teamIds = function (t) { return t === 1 ? m.team1 : m.team2; };
  // 選手ごとの列（そのセットの投擲順）。投擲順を入れていないチーム戦は、誰が投げたか分からないので「得点」の1列
  var players = function (t) {

    return list.length ? list : [null];

  var h = '<table class="sct"><colgroup><col class="tcol">' + cols.map(function (t) {
    return pl[t].map(function () { return '<col>'; }).join('') + '<col class="totcol">';
  }).join('') + '</colgroup><thead><tr><th class="tcol" rowspan="2"></th>' + cols.map(function (t, ci) {
    return '<th colspan="' + pl[t].length + '" class="tname' + (ci ? ' tsep' : '') + '" style="color:var(--t' + t + ')">' + (nextT === t ? '▼ ' : '') + 'チーム' + t + '</th><th class="totcol" rowspan="2">計</th>';
  }).join('') + '</tr><tr>' + cols.map(function (t, ci) {
    return pl[t].map(function (id, i) {
      var sep = ci && !i ? ' tsep' : '';
      return id ? '<th class="pname' + sep + '">' + Array.from(String(P(id).name)).map(esc).join('<br>') + '</th>' : '<th class="pnone' + sep + '">得点</th>';
    }).join('');
  }).join('') + '</tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="' + nCols + '" class="muted">まだ投げていません</td></tr>';
  rows.forEach(function (row, i) {
    h += '<tr><td class="tno">' + (i + 1) + '</td>' + cols.map(function (t, ci) {
      var r = row[t], at = r ? Math.max(0, pl[t].indexOf(r.player || null)) : -1;
      var cells = pl[t].map(function (id, j) {
        var sep = ci && !j ? ' tsep' : '';
        return '<td class="pt' + sep + '">' + (j === at ? (r.kind === 'normal' ? r.points : '—') : '') + '</td>';
      }).join('');
      if (!r) return cells + '<td class="tot"></td>';
      var c = r.event === 'win' ? 'c-win' : r.event === 'out' ? 'c-out' : r.event === 'bust' ? 'c-bust' : r.kind !== 'normal' ? (r.miss_streak >= 2 ? 'c-m2' : 'c-m1') : 'c-ok';
      var tot = r.event === 'out' ? '0<small>失格</small>' : r.score_after;
      return cells + '<td class="tot ' + c + '">' + tot + '</td>';
    }).join('') + '</tr>';
  });
  return h + '</tbody></table>';
}
function scoreLegend() {
  return '<div class="sclegend muted"><span>左のチームが先攻・—はミス</span>' + [['rgba(234,179,8,.5)', '1ミス'], ['rgba(239,68,68,.45)', '2ミス連続'], ['rgba(153,27,27,.7)', '失格'], ['rgba(249,115,22,.55)', 'バースト'], ['rgba(34,197,94,.55)', '上がり']]
    .map(function (x) { return '<span><i style="background:' + x[0] + '"></i>' + x[1] + '</span>'; }).join('') + '</div>';

// 全セットの表を上から並べる（試合終了・履歴）
function scoreTablesAll(st, m) {
  var legs = Math.max(st.legScores.length, st.leg);
  var h = '';
  for (var lg = 1; lg <= legs; lg++) {
    if (!st.log.some(function (r) { return r.leg === lg; })) continue;
    var ls = st.legScores[lg - 1], f1 = st.log.filter(function (r) { return r.leg === lg; })[0].team; // 表の左（先攻）の順で点数を書く
    h += '<div class="sctitle">' + lg + 'セット目' + (ls ? '（' + ls[f1 - 1] + '-' + ls[2 - f1] + '）' : '') + '</div><div class="sctwrap">' + scoreTable(st, m, lg, false) + '</div>';

var SCH = null, schOff = 0, schLoading = false;     // 日程のデータ、サーバーとの時計のずれ

function slotNow(d, h) { var t = schNow(), s = slotT(d, h); return t >= s && t < s + 3600000; }
function dLabel(d) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d), w = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay(); return Number(m[2]) + '/' + Number(m[3]) + '(' + WD[w] + ')'; }

function schHours() { var a = []; for (var h = SCH.day_start; h <= SCH.day_end; h++) a.push(h); return a; }
function schSeen() { try { return JSON.parse(store('kamo_sched_seen') || '{}') || {}; } catch (e) { return {}; } }

function loadSched() {

    .catch(function (e) { schLoading = false; if (tab === 'sched' && !SCH) document.getElementById('main').innerHTML = '<div class="card">日程の読み込みに失敗しました: ' + esc(e.message || e) + '</div>'; });

function schSet(d) {

  if (d.sd) {
    if (schSkipClick) return;
    if (schMode === 'view') { schOpenSlot(d.sd, Number(d.sh)); return; }
    if (t.classList.contains('past')) { schOpenSlot(d.sd, Number(d.sh)); return; } // 過ぎた時間は選べないので、参加者を見せる
    var sk = schKey(d.sd, Number(d.sh));
    if (schSel[sk]) delete schSel[sk]; else schSel[sk] = 1;
    render(); return;
  }
  if (d.smode) { schMode = d.smode; render(); return; }
  if (d.sselgo) { schSelForm(); return; }
  if (d.sselclear) { schSel = {}; render(); return; }
  if (d.sselleave) {
    var lv = schSelList().filter(function (x) { return schMine(x.d, x.h); });
    if (!t.dataset.sure) { t.dataset.sure = 1; t.textContent = 'もう一度押すと取り消し（' + lv.length + '）'; return; }
    schSend('schedLeave', { player_id: schMe, items: lv.map(function (x) { return { date: x.d, hour: x.h }; }), device: deviceId() }, function (r) { schSel = {}; return (r.removed || 0) + '時間の参加をやめました'; });
    return;
  }
  if (d.snew) { schOpenNews(); return; }
  if (d.snewslot) { var nb = schOpen && schOpen.news, sh = Number(d.sh), i = SCH.dates.indexOf(d.snewslot), cols = schCols(); if (i >= 0 && (i < schStart || i >= schStart + cols)) schStart = i; schOpenSlot(d.snewslot, sh, nb); return; }
  if (d.snewback) { if (schOpen && schOpen.back) { schOpen = { news: schOpen.back }; render(); } return; }
  if (d.sday) { schStart = Math.max(0, schStart + Number(d.sday)); render(); return; }
  if (d.sclose) { schOpen = schForm = schBulk = null; render(); return; }
  if (d.sjoin) { schNewForm(schOpen.d, schOpen.h, schOpen.h); return; }
  if (d.sedit) {
    var g = schGroup(schOpen.d, schOpen.h), orig = [];
    for (var hh = g.from; hh <= g.to; hh++) orig.push(hh);
    schForm = { mode: 'edit', d: schOpen.d, from: g.from, to: g.to, orig: orig, place: g.x.place === SCH_ANY ? [] : g.x.place.split(','), other: g.x.other, format: g.x.format, comment: g.x.comment, gear: g.x.gear ? g.x.gear.split(',') : [] };
    schOpen = null; render(); return;
  }
  if (d.sleave) { schSend('schedLeave', { player_id: schMe, items: [{ date: schOpen.d, hour: schOpen.h }], device: deviceId() }, function () { return '参加をやめました'; }); return; }
  if (d.splay) { var ids = (SCH.by[schKey(schOpen.d, schOpen.h)] || []).map(function (x) { return x.p; }); schToPlay(ids, dLabel(schOpen.d) + ' ' + schOpen.h + '時台'); return; }
  var f = schForm || schBulk;
  if (d.splace && f) {
    schPayloadBase(f);
    var v = d.splace, pl = f.place, k = pl.indexOf(v);
    if (v === SCH_ANY) f.place = [];
    else if (k >= 0) pl.splice(k, 1);
    else pl.push(v);
    render(); return;
  }
  if (d.sformat && f) { schPayloadBase(f); f.format = d.sformat; render(); return; }
  if (d.sgear && f) { schPayloadBase(f); f.gear = (f.gear || []).filter(function (k) { return k !== d.sgear; }); if (d.son === '1') f.gear.push(d.sgear); render(); return; }
  if (d.ssave && schForm.mode === 'sel') {
    var ps = schPayloadBase(schForm);
    ps.items = schSelList().map(function (x) { return { date: x.d, hour: x.h }; });
    schSend('schedSet', ps, function (r) { schSel = {}; return ((r.added || 0) + (r.updated || 0)) + '時間に参加しました'; });
    return;
  }
  if (d.ssave) {
    var p = schPayloadBase(schForm), items = [];
    for (var h2 = schForm.from; h2 <= schForm.to; h2++) items.push({ date: schForm.d, hour: h2 });
    p.items = items;
    p.remove = schForm.orig.filter(function (h) { return !slotPast(schForm.d, h); }).map(function (h) { return { date: schForm.d, hour: h }; });
    schSend('schedSet', p, function (r) { return schForm && schForm.mode === 'edit' ? '保存しました' : '参加しました（' + ((r.added || 0) + (r.updated || 0)) + '時間）'; });
    return;
  }
  if (d.sbulk) { if (!schMe) return; schOpen = schForm = null; schBulk = { dates: {}, from: Math.min(18, SCH.day_end), to: SCH.day_end, place: [], other: '', format: 'どちらでも', comment: '', gear: [], overwrite: false }; render(); return; }
  if (d.sq) {
    schPayloadBase(schBulk);
    SCH.dates.forEach(function (dd) { if (slotPast(dd, SCH.day_end)) return; schBulk.dates[dd] = d.sq === 'all' || (d.sq === 'wd' && !dWeekend(dd)) || (d.sq === 'we' && dWeekend(dd)); });
    render(); return;
  }
  if (d.sbd) { schPayloadBase(schBulk); schBulk.dates[d.sbd] = !schBulk.dates[d.sbd]; render(); return; }
  if (d.sbsave) {
    var pb = schPayloadBase(schBulk), it = schBulkItems();
    pb.items = it.items; pb.skip_existing = !schBulk.overwrite;
    schSend('schedSet', pb, function (r) { return (r.added || 0) + (r.updated || 0) + '時間に参加しました' + (r.skipped ? '（参加済み' + r.skipped + '時間は飛ばしました）' : ''); });
    return;
  }
});
document.addEventListener('visibilitychange', function () {
  if (tab !== 'sched') return;
  if (document.visibilityState === 'hidden') schLeave(); else schEnter();
});
window.addEventListener('pagehide', function () { if (tab === 'sched') schLeave(); });
window.addEventListener('resize', function () { if (tab === 'sched' && SCH && !schForm && !schBulk) { var c = schCols(); if (c !== schCols.last) { schCols.last = c; render(); } } });

/* ---- イベント ---- */
// ヘッダーの「更新」: 最新のデータを読み込み直す（日程タブを開いていれば日程も）
document.getElementById('reloadBtn').addEventListener('click', function () {
  var b = this;
  if (b.disabled) return;
  b.disabled = true; b.classList.add('busy');
  var jobs = [call('state').then(function (d) { S = d; render(); })];
  if (tab === 'sched') jobs.push(loadSched());
  Promise.all(jobs).then(function () { toast('最新の情報にしました'); })
    .catch(function (e) { toast('更新できませんでした: ' + (e.message || e), true); })
    .then(function () { b.disabled = false; b.classList.remove('busy'); });
});
// ヘッダーの「ルール」: 観戦用ページのルールタブと同じ内容（参加者用はタブを増やさずボタンで開く）
document.getElementById('ruleBtn').addEventListener('click', function () { if (tab === 'sched') schLeave(); scoreView = null; tab = 'rule'; render(); window.scrollTo(0, 0); });
document.getElementById('adminBtn').addEventListener('click', function () { if (tab === 'sched') schLeave(); scoreView = null; tab = 'admin'; render(); window.scrollTo(0, 0); });
document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { scoreView = null; teamPick = null; cancelArm = null; closeWatch(); if (tab === 'sched' && b.dataset.tab !== 'sched') schLeave(); if (tab !== 'sched' && b.dataset.tab === 'sched') schEnter(); schOpen = schForm = schBulk = null; tab = b.dataset.tab; render(); } });
document.getElementById('main').addEventListener('toggle', function (e) { var d = e.target.dataset && e.target.dataset.logday; if (d) logOpen[d] = e.target.open; }, true);
document.getElementById('main').addEventListener('toggle', function (e) { var k = e.target.dataset && e.target.dataset.sec; if (k) store('kamo_sec_' + k, e.target.open ? '1' : '0'); }, true);
// 絞り込み: 入力欄は描き直さず、リスト（選択肢）だけを入れ替える。
// 画面全体を描き直すと入力欄が作り直され、日本語の変換中の文字が消えたり、スマホのキーボードが閉じたりするため
document.getElementById('main').addEventListener('input', function (e) {
  if (e.target.id === 'meFilter') { meFilter = e.target.value; var mv = document.getElementById('meView'); if (mv) mv.innerHTML = meOptions(); return; }
  if (e.target.id === 'filter') { filter = e.target.value; var tl = document.getElementById('tpList'); if (tl && teamPick) tl.innerHTML = tpListHtml(); }
});
document.getElementById('main').addEventListener('click', function (e) { var b = e.target.closest('[data-rksort]'); if (b) { rankSort = b.dataset.rksort; render(); } });
document.getElementById('main').addEventListener('change', function (e) { if (e.target.id === 'meView') { meView = e.target.value; meAllMatches = false; store('kamo_view', meView); render(); } });
document.getElementById('main').addEventListener('click', function (e) {
  var scl = e.target.closest('[data-scleg]');
  if (scl) { var lc = scoringId && LC[scoringId], wm = !scoringId && curWatch(); scoreSel = { mid: scoringId || watchId, leg: Number(scl.dataset.scleg), len: lc ? lc.throws.length : wm ? (wm.throws || []).length : 0 }; render(); return; }
  var sct = e.target.closest('[data-sct]');
  if (sct) { e.preventDefault(); openScore(sct.dataset.sct); return; }
  if (e.target.closest('[data-scback]')) { closeScore(); return; }
  var t = e.target.closest('[data-up],[data-opt],[data-score],[data-manual],[data-pt],#okThrow,[data-dfirst],[data-dup],[data-result],[data-cancel],[data-void],[data-restore],[data-me],[data-eblist],#meAll,#noOrder,#nextStep,#backStep,[data-teampick],[data-tp],#tpOk,#tpBack,#startBtn,#clearBtn,#adminLogin,#adminRecalc,#virtualToggle,#schedToggle,#schedAutoToggle,#virtualStartSave,#virtualMinSave,[data-cancelno],.cancelov,[data-take],[data-takeno],#watchBack,[data-watch],#undoThrow,#confirmEnd,#legStart,#closeScore,#forceMine,#reloadServer');
  if (!t) return;
  if (t.id !== 'noOrder') e.preventDefault();
  var d = t.dataset;
  if (t.id === 'noOrder') { startOpts.use_order = !t.checked; render(); return; }
  if (d.teampick) { var tt = Number(d.teampick); teamPick = { t: tt, sel: pick[tt].slice(), y: window.scrollY || 0 }; filter = ''; render(); window.scrollTo(0, 0); return; }
  if (d.tp) { var ts = teamPick.sel, ti = ts.indexOf(d.tp); if (ti >= 0) ts.splice(ti, 1); else ts.push(d.tp); render(); return; }
  if (t.id === 'tpOk' || t.id === 'tpBack') { if (t.id === 'tpOk') pick[teamPick.t] = teamPick.sel.slice(); var ty = teamPick.y; teamPick = null; filter = ''; render(); window.scrollTo(0, ty); return; }
  if (t.id === 'nextStep') { startStep = 2; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'backStep') { startStep = 1; render(); window.scrollTo(0, 0); return; }
  if (d.opt) { startOpts[d.opt] = d.opt === 'first_team' ? Number(d.v) : d.v; render(); return; }
  if (d.up) { var arr = pick[d.team], i = arr.indexOf(d.up); if (i > 0) { arr.splice(i, 1); arr.splice(i - 1, 0, d.up); } render(); return; }
  if (d.score) { openScoring(d.score); return; }
  if (d.watch) { openWatch(d.watch); return; }
  if (t.id === 'watchBack') { closeWatch(); render(); window.scrollTo(0, 0); return; }
  if (d.takeno) { takeArm = null; render(); return; }
  if (d.take) { if (takeArm !== d.take) { takeArm = d.take; render(); return; } takeArm = null; openScoring(d.take); return; }
  if (d.manual) { manualOpen[d.manual] = !manualOpen[d.manual]; render(); return; }
  if (d.pt) { var lp = LC[scoringId], v = Number(d.pt); lp.selPt = lp.selPt === v ? null : v; render(); return; }
  if (t.id === 'okThrow') { var lo = LC[scoringId]; if (lo.selPt) addThrow('normal', lo.selPt); else addThrow('miss'); return; }
  if (t.id === 'undoThrow') { undoThrow(); return; }
  if (t.id === 'confirmEnd') { LC[scoringId].confirmEnd = true; LC[scoringId].ver++; lcSave(scoringId); queueSync(true); render(); return; }
  if (d.dfirst) { LC[scoringId].draft.first = Number(d.dfirst); render(); return; }
  if (d.dup) { var dl = LC[scoringId].draft.o[d.team - 1], di = dl.indexOf(d.dup); if (di > 0) { dl.splice(di, 1); dl.splice(di - 1, 0, d.dup); } render(); return; }
  if (t.id === 'legStart') {
    var lg = LC[scoringId], dr = lg.draft, mm0 = findM(scoringId);
    if (mm0.use_order) { while (lg.leg_orders.length < dr.leg - 1) lg.leg_orders.push(null); lg.leg_orders[dr.leg - 1] = [dr.o[0].slice(), dr.o[1].slice()]; }
    if (dr.leg === 3 && dr.first) lg.leg3_first = dr.first;
    lg.draft = null; changed(); return;
  }
  if (t.id === 'closeScore') { scoringId = null; render(); return; }
  if (t.id === 'forceMine') { var lf = LC[scoringId]; lf.conflict = null; lf.takeover = true; lf.ver++; lcSave(scoringId); queueSync(true); render(); return; }
  if (t.id === 'reloadServer') { var rid = scoringId; lcDrop(rid); call('state').then(function (dd) { S = dd; openScoring(rid); }); return; }
  if (t.id === 'meAll') { meAllMatches = !meAllMatches; render(); return; }
  if (d.eblist) { var lk = meView + ':' + d.eblist; listOpen[lk] = !listOpen[lk]; render(); return; }
  if (d.me) { meView = d.me; tab = 'me'; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'clearBtn') { pick = { 1: [], 2: [] }; startOpts.first_team = null; render(); return; }
  if (t.id === 'startBtn') { t.disabled = true; startSending++; showSendNotice(); var opts = { team1: pick[1], team2: pick[2], scoring: startOpts.scoring, use_order: startOpts.scoring === 'throws' && (startOpts.use_order || (pick[1].length === 1 && pick[2].length === 1)), first_team: startOpts.first_team };
    act('start', opts, '試合を開始しました').then(function (ok) {
      startSending--; showSendNotice();
      if (!ok) return;
      pick = { 1: [], 2: [] }; startOpts = { scoring: 'throws', use_order: true, first_team: null }; startStep = 1; schCands = null;
      if (opts.scoring === 'throws') { var nm = S.matches.filter(function (x) { return x.status === 'playing' && x.started_by === '端末' + deviceId(); })[0]; if (nm) { openScoring(nm.id); return; } }
      render();
    }); return; }
  if (d.result) {
    var box = t.closest('.match'), v = function (f) { return box.querySelector('[data-f=' + f + ']').value; };
    t.disabled = true; manualSending++; showSendNotice();
    var rid0 = d.result;
    act('result', { match_id: rid0, team1_legs: v('legs1'), team2_legs: v('legs2'), team1_score: v('score1'), team2_score: v('score2') }, '結果を記録しました').then(function (ok) { t.disabled = false; manualSending--; if (ok && watchId === rid0) closeWatch(); render(); });
    return;
  }
  if (d.cancelno || (t.classList.contains('cancelov') && e.target === t)) { cancelArm = null; render(); return; }
  if (d.cancel) {
    var cid = d.cancel;
    if (cancelArm !== cid) { cancelArm = cid; render(); return; }
    cancelArm = null; t.disabled = true;
    if (scoringId === cid) clearTimeout(syncTimer);
    call('cancel', { match_id: cid, device: deviceId() }).then(function (data) {
      S = data; lcDrop(cid); delete manualOpen[cid]; if (scoringId === cid) scoringId = null; if (watchId === cid) closeWatch(); render(); toast('試合を取り消しました');
    }).catch(function (e) { render(); toast(e.message || String(e), true); });
    return;
  }
  if (t.id === 'adminLogin') { var k = document.getElementById('adminKey').value; call('adminCheck', { admin_key: k }).then(function () { adminKey = k; render(); }).catch(function (er) { toast(er.message || er, true); }); return; }
  if (t.id === 'schedAutoToggle') { var ao = t.dataset.on !== '1'; act('adminSetting', { admin_key: adminKey, key: 'sched_auto_join', value: ao }, ao ? '試合開始で日程に自動追加します' : '自動追加をやめました'); return; }
  if (t.id === 'schedToggle') { var so = t.dataset.on !== '1'; act('adminSetting', { admin_key: adminKey, key: 'sched_visible', value: so }, so ? '日程タブを表示します' : '日程タブを非表示にしました'); return; }
  if (t.id === 'virtualToggle') { var on = t.dataset.on !== '1'; act('adminSetting', { admin_key: adminKey, key: 'virtual_rating_visible', value: on }, on ? '参考レートを表示します' : '参考レートを非表示にしました'); return; }
  if (t.id === 'virtualStartSave') { var vs = document.getElementById('virtualStart').value.trim(); act('adminSetting', { admin_key: adminKey, key: 'virtual_initial_rating', value: vs }, vs === '' ? '参考レートを固定レートから始めます' : '参考レートを ' + vs + ' から始めます'); return; }
  if (t.id === 'virtualMinSave') { var vm = document.getElementById('virtualMin').value.trim(); act('adminSetting', { admin_key: adminKey, key: 'virtual_min_matches', value: vm }, vm === '' ? '参考合計の最低試合数を予選と同じにしました' : '参考合計の最低試合数を ' + vm + '試合にしました'); return; }
  if (t.id === 'adminRecalc') { act('adminRecalc', { admin_key: adminKey }, '再計算しました'); return; }
  if (d.void) { if (t.dataset.sure) act('adminVoid', { admin_key: adminKey, match_id: d.void, note: '運営が無効化' }, '無効にしました'); else { t.dataset.sure = 1; t.textContent = 'もう一度押すと無効'; } return; }
  if (d.restore) { act('adminRestore', { admin_key: adminKey, match_id: d.restore }, '元に戻しました'); return; }
});

if (VIEW_ONLY) { // 観戦用ページ: 試合・日程タブと運営ボタンを消し、試合中タブと帯を出す
  document.body.classList.add('viewonly');
  document.title = '鴨王戦 予選（観戦用）';
  document.querySelector('header h1').textContent = '鴨王戦 予選（観戦用）';
  ['play', 'sched', 'log'].forEach(function (k) { var b = document.querySelector('#tabs [data-tab=' + k + ']'); b.parentNode.removeChild(b); });
  document.querySelector('#tabs [data-tab=live]').hidden = false; document.querySelector('#tabs [data-tab=rule]').hidden = false;
  document.querySelector('header .hrow').style.display = 'none'; // ルールはタブで出すので、ルール・運営ボタンは消す
  document.getElementById('viewBanner').hidden = false;
}
load();
setInterval(function () {
  if (document.visibilityState !== 'visible' || syncing) return;
  if (scoringId && LC[scoringId] && LC[scoringId].ver > LC[scoringId].sentVer) { queueSync(true); return; } // 未送信があれば再送
  if (scoringId || document.activeElement.matches('input,select')) return; // 入力中は画面を書き換えない
  if (tab === 'sched' && (schOpen || schForm || schBulk || schDrag)) return; // 日程の入力中・詳細を開いている間は書き換えない
  call('state').then(function (d) { S = d; render(); }).catch(function () {});
  if (tab === 'sched') loadSched();
}, 30000);
</script>
