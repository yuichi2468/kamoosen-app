<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鴨王戦 予選レート戦</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #e2e0d8;
  --accent: #1f6f50; --accent-ink: #ffffff; --accent-soft: #e3f1ea;
  --t1: #2a5db0; --t1-soft: #e6eefb; --t2: #b5482a; --t2-soft: #fbebe5;
  --win: #1f7a3f; --lose: #b3261e; --warn: #8a5a00; --warn-soft: #fff4d6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 15px; line-height: 1.5; }
header { background: var(--accent); color: var(--accent-ink); padding: 14px 16px 10px; }
header { position: relative; }
header h1, header .sub { padding-right: 52px; }
.adminbtn { position: absolute; top: 10px; right: 12px; background: transparent; color: var(--accent-ink); border: 1px solid currentColor; opacity: .7; border-radius: 8px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
.adminbtn.on { opacity: 1; background: rgba(255,255,255,.15); }
header h1 { margin: 0; font-size: 18px; letter-spacing: .04em; }
header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
nav { display: flex; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; overflow-x: auto; }
nav button { flex: 1; min-width: 64px; white-space: nowrap; border: 0; background: none; padding: 12px 6px; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; }
nav button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
main { max-width: 760px; margin: 0 auto; padding: 14px 16px 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.card h2 { font-size: 16px; margin: 0 0 10px; }
.muted { color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.zone td { background: var(--accent-soft); }
tr.cut td { border-bottom: 2px dashed var(--accent); }
.scroll { overflow-x: auto; }
a { color: var(--accent); text-decoration: none; font-weight: 600; }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--line); color: var(--ink); margin-left: 4px; }
.badge.ok { background: var(--accent-soft); color: var(--accent); }
.award { border-top: 1px solid var(--line); padding: 8px 0; }
.award .ahead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 4px; }
.award .ahead .muted { font-size: 12px; }
.arow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 3px 0; font-size: 15px; }
.arank { display: inline-block; min-width: 3.2em; font-size: 13px; color: var(--muted); }
.arank.r1 { color: #b07a00; font-weight: 700; }
.arow.prov .arank, .arow.prov .aval { opacity: .75; }
.amore summary { cursor: pointer; font-size: 13px; color: var(--muted); padding: 3px 0; list-style: none; }
.amore summary::-webkit-details-marker { display: none; }
.amore summary::before { content: '▸ '; }
.amore[open] summary::before { content: '▾ '; }
.aval { margin-left: auto; font-variant-numeric: tabular-nums; }
.adet { flex-basis: 100%; font-size: 12px; padding-left: 3.6em; }
.badge.award-b { background: #fff1c9; color: #6b4a00; margin: 2px 4px 2px 0; font-size: 12px; padding: 2px 8px; border: 1px solid transparent; }
/* 特別賞のバッジ: 1位 金・2位 銀・3位 銅・メモリアル 青。暫定は点線の枠 */
.badge.award-b.r1 { background: #fde68a; color: #6b4a00; border-color: #e0b100; }
.badge.award-b.r2 { background: #e5e7eb; color: #374151; border-color: #9ca3af; }
.badge.award-b.r3 { background: #f3d2b5; color: #6b3a12; border-color: #c2814d; }
.badge.award-b.r0 { background: #dbeafe; color: #1e3a8a; border-color: #93c5fd; }
.badge.award-b.prov { border-style: dashed; opacity: .85; }
.stat small { display: block; font-size: 12px; font-weight: 400; }
.stat.stat2 { grid-template-columns: 1fr 1fr; row-gap: 12px; }
.ebrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.ebrow .ebpt { margin-left: auto; color: var(--win); }
.ebrow .ebnext { flex-basis: 100%; font-size: 12px; }
.ebrow.tap { cursor: pointer; }
.ebtog { font-size: 12px; white-space: nowrap; }
.eblist { padding: 4px 0 10px; }
.chip.off { opacity: .6; border-style: dashed; }
.rktable th, .rktable td { padding-left: 4px; padding-right: 4px; }
.rkbonus { color: var(--win); }
.heroproj { font-size: 13px; margin-top: 2px; }
.heroproj b { color: var(--win); }
.ba { font-size: 12px; color: var(--muted); font-weight: 400; line-height: 1.4; margin-top: 2px; font-variant-numeric: tabular-nums; }
.sclink { font-size: 13px; white-space: nowrap; margin-left: 6px; }
.sctabs { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
.sctabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
.sctabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.sctwrap { margin-top: 6px; }
.sctwrap.live { max-height: 232px; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 8px; }
.sctitle { font-weight: 700; margin: 12px 0 4px; font-size: 14px; }
.sct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
.sct th, .sct td { border: 1px solid #9aa19d; text-align: center; padding: 3px 2px; white-space: normal; }
.sct thead th { background: rgba(120,120,140,.12); font-size: 12px; font-weight: 600; position: sticky; top: 0; }
.sct thead tr:first-child th { font-size: 13px; font-weight: 700; }
.sct thead tr:nth-child(2) th { top: 25px; }
.sct th.tcol { width: 3.2em; }
.sct tbody tr:nth-child(even) td { background: rgba(120,120,120,.08); }
.sct td.pt { font-size: 15px; }
.sct td.pt small { display: block; font-size: 10px; color: var(--muted); line-height: 1.1; }
.sct td.tot { font-size: 18px; font-weight: 800; }
.sct td.tot small { display: block; font-size: 10px; font-weight: 600; }
.sct tbody tr td.c-ok { background: rgba(59,130,246,.20); }
.sct tbody tr td.c-m1 { background: rgba(234,179,8,.30); }
.sct tbody tr td.c-m2 { background: rgba(239,68,68,.28); }
.sct tbody tr td.c-out { background: rgba(153,27,27,.55); color: #fff; }
.sct tbody tr td.c-bust { background: rgba(249,115,22,.35); }
.sct tbody tr td.c-win { background: rgba(34,197,94,.35); }
.sclegend { font-size: 11px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.sclegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 2px; vertical-align: -1px; }
.ebrow.ebtotal { font-weight: 700; }
.mepick { display: grid; gap: 8px; }
.mepick input, .mepick select { width: 100%; }
.hero { border: 2px solid var(--accent); }
.herotop { font-size: 13px; }
.heroname { font-size: 20px; font-weight: 800; margin: 2px 0 2px; }
.herorate b { font-size: 24px; color: var(--accent); font-variant-numeric: tabular-nums; }
.herobadges { margin-top: 8px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; text-align: center; }
.tile span { display: block; font-size: 11px; }
.tile b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; margin: 1px 0; }
.tile small { display: block; font-size: 10px; }
.tile.win b { color: var(--win); } .tile.lose b { color: var(--lose); }
.setbd { margin-bottom: 4px; }
.setbd .setrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; text-align: center; }
.setrow span { display: block; font-size: 13px; font-weight: 700; }
.setrow b { font-size: 20px; }
.setrow .win span { color: var(--win); } .setrow .lose span { color: var(--lose); }
.setrow .soft span { opacity: .75; }
.qtitle { margin-bottom: 4px; }
.recent .rrow { display: grid; grid-template-columns: auto auto 1fr auto; gap: 2px 8px; align-items: baseline; padding: 8px 6px; border-top: 1px solid var(--line); }
.recent .rrow.lost { background: color-mix(in srgb, var(--lose) 6%, transparent); }
.rdate { font-size: 12px; } .rres { font-weight: 700; }
.rvs small { display: block; }
.rsets { grid-column: 2 / 4; font-size: 13px; font-variant-numeric: tabular-nums; }
.rdelta { grid-column: 4; grid-row: 1 / 3; font-weight: 700; text-align: right; }
.rdelta small { display: block; font-weight: 400; font-size: 12px; white-space: nowrap; }
details.sec summary { cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary::before { content: '▸ '; color: var(--muted); }
details.sec[open] summary::before { content: '▾ '; }
details.sec[open] summary { margin-bottom: 8px; }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.btn { display: inline-block; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 10px; font-size: 15px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--lose); background: transparent; color: var(--lose); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.team { border-radius: 10px; padding: 10px; min-height: 76px; }
.team.t1 { background: var(--t1-soft); border: 1px solid var(--t1); }
.team.t2 { background: var(--t2-soft); border: 1px solid var(--t2); }
.team h3 { margin: 0 0 6px; font-size: 13px; }
.team.t1 h3 { color: var(--t1); } .team.t2 h3 { color: var(--t2); }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin: 2px; font-size: 13px; cursor: pointer; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 340px; overflow-y: auto; }
.pitem { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px 5px 10px; font-size: 14px; }
.pitem.off { opacity: .4; }
.pitem .pick { display: flex; gap: 4px; }
.pitem .pick button { width: 30px; height: 28px; border-radius: 6px; border: 1px solid; font-weight: 700; cursor: pointer; background: var(--card); }
.pitem .pick .b1 { border-color: var(--t1); color: var(--t1); }
.pitem .pick .b2 { border-color: var(--t2); color: var(--t2); }
.preview { background: var(--bg); border-radius: 10px; padding: 10px; font-size: 14px; margin: 8px 0; }
.up { color: var(--win); font-weight: 700; } .down { color: var(--lose); font-weight: 700; }
input[type=search], input[type=number], input[type=password], select { font-size: 15px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
input[type=number] { width: 80px; }
.match { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.match .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.match .side { font-size: 14px; }
.match .side.t1 { color: var(--t1); } .match .side.t2 { color: var(--t2); text-align: right; }
.match .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.res label { font-size: 12px; color: var(--muted); display: block; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; display: none; }
.toast.err { background: var(--lose); color: #fff; }
.bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar.done > i { background: var(--win, var(--accent)); }
.quota { margin: 8px 0; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
.short { color: var(--lose); }
.met { color: var(--win); }
.met small { font-size: 11px; margin-left: 1px; }
.minbox { border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin: 0 0 10px; font-size: 14px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
svg.chart { width: 100%; height: auto; display: block; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
/* スコア入力 */
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--card); color: var(--accent); padding: 8px 12px; font-size: 14px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.opt { margin: 10px 0; display: grid; gap: 10px; }
.chip .mini { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 0 4px; cursor: pointer; }
.board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.board .tb { border-radius: 10px; padding: 10px; text-align: center; border: 2px solid transparent; }
.board .tb.t1 { background: var(--t1-soft); } .board .tb.t2 { background: var(--t2-soft); }
.board .tb.turn.t1 { border-color: var(--t1); } .board .tb.turn.t2 { border-color: var(--t2); }
.board .big { font-size: 40px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.board .legs { font-size: 13px; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 6px; margin: 4px 0; font-size: 30px; line-height: 1; height: 34px; align-items: center; }
.dots span { width: 30px; text-align: center; color: var(--line); }
.dots .x { color: var(--lose); font-weight: 900; }
.nextbar { margin: 10px 0; padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 15px; text-align: center; }
.points { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 12px; }
.points button { padding: 16px 0; border-radius: 12px; border: 2px solid var(--ink); background: var(--card); color: var(--ink); font-size: 26px; font-weight: 800; cursor: pointer; line-height: 1; }
.points button.on { background: var(--ink); color: var(--bg); }
.stars { font-size: 26px; line-height: 1; height: 28px; color: #c98a00; letter-spacing: 2px; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.keys .btn { width: 100%; text-align: center; }
.keys .wide { grid-column: span 2; padding: 14px; font-size: 17px; }
.olist { list-style: none; padding: 0; margin: 6px 0 0; }
.olist li { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.firstpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 12px; }
.firstpick button { min-height: 76px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 20px; font-weight: 700; cursor: pointer; padding: 8px; line-height: 1.3; }
.firstpick button small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.firstpick button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.firstpick button.on small { color: var(--accent-ink); }
.firstpick.sm button { min-height: 52px; font-size: 16px; padding: 6px; }
.firstpick.sm button small { font-size: 12px; }
.startrow { display: flex; gap: 10px; margin: 12px 0 10px; }
.startrow #startBtn, .startrow #nextStep { flex: 1; min-height: 60px; font-size: 22px; font-weight: 700; border-radius: 12px; }
.startrow #nextStep small { display: block; font-size: 13px; font-weight: 400; }
.startrow #clearBtn { flex: 0 0 auto; }
/* スコア入力画面: スマホ（375×667 程度）で1画面に収まる大きさ */
body.scoring header { display: none; }
body.scoring main { padding-top: 8px; }
body.scoring .card { padding: 10px 12px; }
body.scoring .board .tb { padding: 6px 4px; }
body.scoring .board .big { font-size: 32px; }
body.scoring .stars { font-size: 20px; height: 22px; }
body.scoring .dots { font-size: 22px; height: 24px; margin: 2px 0; }
body.scoring .dots span { width: 24px; }
body.scoring .nextbar { margin: 6px 0; padding: 6px 8px; font-size: 14px; }
body.scoring .points { gap: 6px; margin: 4px 0 8px; }
body.scoring .points button { padding: 11px 0; font-size: 21px; border-radius: 10px; }
body.scoring .keys { gap: 6px; }
body.scoring .keys .btn { padding: 11px 8px; font-size: 16px; }
.sendnotice { position: fixed; left: 0; right: 0; top: 0; z-index: 30; background: var(--warn); color: #fff; padding: 14px 16px; text-align: center; font-size: 16px; font-weight: 700; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.sendnotice[hidden] { display: none; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 14px; }
.live { font-size: 14px; margin-top: 6px; }
@media (max-width: 480px) { .teams { grid-template-columns: 1fr; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <button id="adminBtn" class="adminbtn" aria-label="運営メニュー">運営</button>
  <h1>鴨王戦 予選レート戦</h1>
  <div class="sub" id="period"></div>
</header>
<nav id="tabs">
  <button data-tab="rank" class="on">ランキング</button>
  <button data-tab="play">試合</button>
  <button data-tab="log">履歴</button>
  <button data-tab="me">個人</button>
  <button data-tab="awards">特別賞</button>
</nav>
<main id="main"><div class="loading">読み込み中…</div></main>
<div class="toast" id="toast"></div>
<div class="sendnotice" id="sendNotice" role="alert" hidden></div>

<script>
/* 外部（GitHub Pages など）に置く場合は、Apps Script ウェブアプリの URL をここに入れる。
   Apps Script から直接開く場合は空のままでよい。 */
var API_URL = '';

var S = null;          // サーバーから受け取った状態
var tab = 'rank';
var listOpen = {}; // 個人ページの「組んだ人・戦った相手」の一覧を開いているか
var pick = { 1: [], 2: [] };
var filter = '';
var meView = '', meFilter = '', meAllMatches = false;
var adminKey = '';
var startOpts = { scoring: 'throws', use_order: true, first_team: null }; // 標準は1投ごとの記録（個人の投擲順あり）。結果だけ入力は予備
var startStep = 1; // 試合開始: 1=メンバーを選ぶ、2=投擲順と先攻を決める（設計書 18.2）
var scoringId = null;      // スコア入力中の試合
var LC = {};               // 端末内の記録 { mid: { throws, leg3_first, leg_orders, base_rev, ver, sentVer, takeover, conflict, confirmEnd, draft } }
var manualOpen = {};
var syncing = false, syncTimer = null;

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

function call(action, payload) {
  payload = payload || {};
  if (window.google && google.script && google.script.run) {
    return new Promise(function (res, rej) {
      google.script.run.withSuccessHandler(function (r) {
        if (r && r.ok) res(r.data);
        else rej(new Error(r ? r.error : '通信エラー（サーバーからの応答が空でした。Apps Script を最新版に貼り替えて「新バージョン」でデプロイし直してください）'));
      }).withFailureHandler(function (e) { rej(new Error('通信エラー: ' + (e && e.message ? e.message : e))); }).api(action, payload);
    });
  }
  var url = API_URL || window.KAMO_API_URL;
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, payload: payload }) })
    .then(function (r) { return r.json(); })
    .then(function (r) { if (!r.ok) throw new Error(r.error); return r.data; });
}

/* ---- レート計算（サーバーと同じ式。見込み表示用） ---- */
function roundHalfUp(v) { var x = Math.round(v * 1e6) / 1e6; return x >= 0 ? Math.floor(x + 0.5) : -Math.floor(-x + 0.5); }
function n(v, d) { var x = Number(v); return v === '' || v === null || v === undefined || isNaN(x) ? d : x; }
function computeDelta(winAvg, loseAvg, c) {
  c = c || {};
  var gain = roundHalfUp(n(c.win_base, 24) + (loseAvg - winAvg) * n(c.win_coef, 0.06));
  var loss = roundHalfUp(n(c.loss_base, 20) + (loseAvg - winAvg) * n(c.loss_coef, 0.05));
  return { gain: Math.max(n(c.min_gain, 10), gain), loss: Math.max(n(c.min_loss, 10), loss) };
}

/* ENGINE START — 1投ごとのスコア計算（Code.gs と index.html に同じものが入る。編集は engine.js で行い、node test/build.js で反映） */
/**
 * 投擲の列を最初から再生して、試合の現在の状態を返す。
 * match: {
 *   team1, team2: [選手ID...]（1セット目の投擲順）, first_team: 1|2（1セット目の先攻）,
 *   use_order: 個人の投擲順を入れるか, leg3_first: 1|2|null（3セット目の先攻）,
 *   leg_orders: [[team1順, team2順], ...]（セットごとの投擲順。1セット目は省略可）
 * }
 * throws: [{ kind: 'normal'|'miss'|'foul', points: 1〜12 }]（投げた人・チームは順番から自動で決まる）
 *   points の代わりに pins: [倒れたピンの番号...] でも受け付ける（1本ならその数字、2本以上なら本数）
 */
function molkkyReplay(match, throws) {
  var first = Number(match.first_team) === 2 ? 2 : 1;
  var st = {
    leg: 1, legsWon: [0, 0], scores: [0, 0], misses: [0, 0], legScores: [], totals: [0, 0],
    legFirst: first, turn: first, playerIdx: [0, 0], finished: false, winner: null,
    needSetup: false, needFirst: false, needOrder: false, leg3Chooser: null,
    orders: [], log: [], error: null
  };
  var teams = [match.team1 || [], match.team2 || []];
  function orderFor(leg) {
    var lo = match.leg_orders && match.leg_orders[leg - 1];
    if (lo && lo[0] && lo[0].length && lo[1] && lo[1].length) return [lo[0].slice(), lo[1].slice()];
    if (leg === 1 || (teams[0].length <= 1 && teams[1].length <= 1)) return [teams[0].slice(), teams[1].slice()]; // 個人戦は選び直し不要
    return null;
  }
  function startLeg() {
    st.needSetup = st.needFirst = st.needOrder = false;
    st.scores = [0, 0]; st.misses = [0, 0]; st.playerIdx = [0, 0];
    if (st.leg === 1) st.legFirst = first;
    else if (st.leg === 2) st.legFirst = 3 - first; // 2セット目は1セット目の後攻チームが先攻
    else {
      // 3セット目: 2セット目終了時点の総得点が高いチームが先攻を選ぶ（同点はドローショット）
      st.leg3Chooser = st.totals[0] > st.totals[1] ? 1 : st.totals[1] > st.totals[0] ? 2 : 0;
      if (match.leg3_first === 1 || match.leg3_first === 2) st.legFirst = match.leg3_first;
      else { st.legFirst = null; st.needFirst = true; }
    }
    var o = orderFor(st.leg);
    if (match.use_order && st.leg > 1 && !o) st.needOrder = true; // 2セット目以降は投擲順を選び直す
    st.orders[st.leg - 1] = o || (st.orders[st.leg - 2] || [teams[0].slice(), teams[1].slice()]);
    st.needSetup = st.needFirst || st.needOrder;
    st.turn = st.legFirst;
  }
  function nextPlayer(team) {
    if (!match.use_order) return '';
    var list = st.orders[st.leg - 1][team - 1];
    return list.length ? list[st.playerIdx[team - 1] % list.length] : '';
  }
  function endLeg(winTeam) {
    st.legsWon[winTeam - 1]++;
    st.legScores.push([st.scores[0], st.scores[1]]);
    st.totals[0] += st.scores[0]; st.totals[1] += st.scores[1];
    if (st.legsWon[winTeam - 1] >= 2) { st.finished = true; st.winner = winTeam; return; }
    st.leg++;
    startLeg();
  }
  startLeg();
  for (var i = 0; i < throws.length; i++) {
    var t = throws[i] || {};
    if (st.finished) { st.error = '試合はすでに終わっています（' + (i + 1) + '投目）'; break; }
    if (st.needSetup) { st.error = st.leg + 'セット目の' + (st.needFirst ? '先攻' : '投擲順') + 'が決まっていません'; break; }
    var team = st.turn, k = team - 1;
    var pins = (t.pins || []).map(Number).filter(function (p) { return p >= 1 && p <= 12 && p % 1 === 0; });
    var given = Number(t.points);
    var hasPoints = given >= 1 && given <= 12 && given % 1 === 0;
    if (t.kind === 'normal' && t.points !== undefined && t.points !== null && !hasPoints) { st.error = '得点は1〜12で入力してください（' + (i + 1) + '投目）'; break; }
    var kind = t.kind === 'foul' ? 'foul' : (t.kind === 'miss' || (!hasPoints && pins.length === 0) ? 'miss' : 'normal');
    if (kind !== 'normal' || hasPoints) pins = [];
    var seen = {};
    for (var j = 0; j < pins.length; j++) { if (seen[pins[j]]) { st.error = '同じピンが2回あります'; break; } seen[pins[j]] = 1; }
    if (st.error) break;
    var points = kind !== 'normal' ? 0 : hasPoints ? given : (pins.length === 1 ? pins[0] : pins.length);
    var rec = { leg: st.leg, team: team, player: nextPlayer(team), kind: kind, pins: pins, points: points, event: '' };
    if (kind === 'normal') {
      st.misses[k] = 0;
      var sc = st.scores[k] + points;
      if (sc > 50) { sc = 25; rec.event = 'bust'; } // 50を超えたらバースト（25点に戻る）
      st.scores[k] = sc;
      if (sc === 50) rec.event = 'win';
    } else {
      st.misses[k]++;
      if (st.misses[k] >= 3) { rec.event = 'out'; st.scores[k] = 0; } // 3回連続ミスで失格。失格したチームは0点
    }
    rec.score_after = st.scores[k]; rec.miss_streak = st.misses[k];
    st.log.push(rec);
    st.playerIdx[k]++;
    if (rec.event === 'win') endLeg(team);
    else if (rec.event === 'out') { st.scores[2 - team] = 50; endLeg(3 - team); } // 相手が3ミスなら自分たちは50点、相手は0点
    else st.turn = 3 - team;
  }
  st.nextTeam = st.finished || st.needSetup || st.error ? null : st.turn;
  st.nextPlayer = st.nextTeam ? nextPlayer(st.nextTeam) : '';
  return st;
}

/** 倒れたピンから得点を出す（1本ならその数字、2本以上なら本数） */
function molkkyPoints(pins) { return !pins || !pins.length ? 0 : pins.length === 1 ? Number(pins[0]) : pins.length; }
/* ENGINE END */

/* ---- 表示ヘルパー ---- */
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function P(id) { for (var i = 0; i < S.players.length; i++) if (S.players[i].id === id) return S.players[i]; return { id: id, name: id, rating: 0 }; }
function names(ids) { return ids.map(function (id) { return esc(P(id).name); }).join('・'); }
function fmt(t) {
  if (!t || isNaN(t)) return '';
  try { return new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(t)); }
  catch (e) { var d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
}
function sgn(v) { if (v === undefined || v === null || v === '') return ''; return (v > 0 ? '<span class="up">+' : '<span class="down">') + v + '</span>'; }
/* 端末ごとのランダムな記号（記録者の特定はしない。運営が log で操作元を追うためだけに使う） */
function deviceId() {
  var d = store('kamo_device');
  if (!d) { d = Math.random().toString(36).slice(2, 8); store('kamo_device', d); }
  return d || 'nostore';
}
function toast(msg, err) {
  var t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 5000 : 2500);
}
function act(action, payload, okMsg) {
  payload = payload || {};
  if (action.indexOf('admin') !== 0) { payload.device = deviceId(); }
  return call(action, payload).then(function (data) { S = data; render(); if (okMsg) toast(okMsg); return true; })
    .catch(function (e) { toast(e.message || String(e), true); return false; });
}

function load() {
  return call('state').then(function (d) { S = d; if (!meView) meView = store('kamo_view') || ''; render(); })
    .catch(function (e) { document.getElementById('main').innerHTML = '<div class="card">読み込みに失敗しました: ' + esc(e.message || e) + '</div>'; });
}

function render() {
  var s = S.settings;
  s.end_at_label = function () { var now = Date.now(); if (now < s.start_at) return '開始前'; if (now >= s.end_at) return '試合開始は締切済み'; var h = Math.floor((s.end_at - now) / 3600000); return '残り ' + Math.floor(h / 24) + '日' + (h % 24) + '時間'; };
  document.getElementById('period').textContent = '期間 ' + fmt(s.start_at) + ' 〜 ' + fmt(s.end_at) + '（' + s.end_at_label() + '）';
  document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === tab); });
  document.getElementById('adminBtn').classList.toggle('on', tab === 'admin');
  var html = scoreView ? viewScoreScreen() : ({ rank: viewRank, play: viewPlay, log: viewLog, me: viewMe, awards: viewAwardsTab, admin: viewAdmin })[tab]();
  document.getElementById('main').innerHTML = html;
  var sw = document.querySelector('.sctwrap.live'); if (sw) sw.scrollTop = sw.scrollHeight; // 最新のターンが見えるように
  document.body.classList.toggle('scoring', !!scoringId && tab === 'play'); // スコア入力中は見出しを隠して1画面に収める

}
function showSendNotice() {
  var el = document.getElementById('sendNotice'), what = sendingWhat();

/* 試合結果を送信中か（送信が終わるまで画面を閉じないよう注意を出す） */
var manualSending = 0, startSending = 0;
function sendingWhat() {
  if (manualSending > 0 || Object.keys(LC).some(function (k) { return LC[k] && LC[k].confirmEnd && !LC[k].conflict; })) return '試合結果を送信しています。';

    h += '<tr class="' + cls + '"><td class="num">' + r.rank + '</td><td><a href="#" data-me="' + esc(r.player_id) + '">' + esc(r.name) + '</a>' + (r.playoff ? '<span class="badge warn">プレーオフ</span>' : '') + '</td>' +
      '<td class="num">' + r.rating + '</td><td class="num rkbonus">' + (r.bonus > 0 ? '+' : '') + r.bonus + '</td><td class="num"><b>' + r.total + '</b></td>' +
      '<td class="num">' + quotaCell(r.matches, n(s.min_matches, 20)) + '</td><td class="num">' + quotaCell(r.team_matches, n(s.min_team_matches, 5)) + '</td></tr>';
  });
  h += '</tbody></table></div>';
  h += '<p class="muted" style="margin:10px 0 0">合計（レート＋ボーナス）の順です。色付きの行が通過圏内（上位' + q + '名）です。ボーナスは手動ボーナス・追加ボーナス・1回生のハンデの合計です。' + 'ボーナスは減ることがないので、予選中も合計に入れています。' + '</p><div class="minbox" style="margin:8px 0 0">予選通過には<b>最低 ' + n(s.min_matches, 20) + '試合</b>（そのうち<b>チーム戦 最低 ' + n(s.min_team_matches, 5) + '試合</b>）が必要です。<br><span class="muted">試合数とチーム戦は、足りないときは<b class="short">赤</b>、達したら<b class="met">緑✓</b>です。両方 ✓ で最低条件を達成です。</span></div></div>';

function quotaCell(have, need) { return have < need ? '<b class="short">' + have + '</b>' : '<b class="met">' + have + '<small>✓</small></b>'; }

function myAwards(id) {

  A.awards.forEach(function (a) { a.entries.forEach(function (e) { if (e.player_id === id) out.push({ rank: e.rank, prov: e.provisional, text: a.name + ' ' + (e.provisional ? '暫定' : '') + e.rank + '位（' + awardValue(a.key, e.value, e) + '）' }); }); });

/* ---- 試合 ---- */
function teamAvg(ids) { return ids.reduce(function (a, id) { return a + P(id).rating; }, 0) / ids.length; }
function busySet() { var b = {}; S.matches.forEach(function (m) { if (m.status === 'playing') m.team1.concat(m.team2).forEach(function (id) { b[id] = 1; }); }); return b; }
function singles(a, b) { return S.singles[a < b ? a + '|' + b : b + '|' + a] || 0; }

function viewPlay() {
  if (scoringId) return viewScoring();
  var s = S.settings, max = n(s.max_team_size, 4), busy = busySet();
  var h = '';
  // 進行中の試合
  var playing = S.matches.filter(function (m) { return m.status === 'playing'; });
  if (playing.length) {
    h += '<div class="card"><h2>試合中</h2>';
    playing.forEach(function (m) { h += matchCard(m); });
    h += '</div>';
  }
  // 新しい試合（画面2: 投擲順と先攻後攻）
  if (startStep === 2 && pick[1].length && pick[2].length && startOpts.scoring === 'throws') return h + viewStartStep2();
  startStep = 1;
  h += '<div class="card"><h2>試合を始める</h2>';
  h += '<p class="muted">各チーム1〜' + max + '人。名前の横の「1」「2」でチームに入れます。×で外せます。</p>';
  h += '<div class="teams">' + [1, 2].map(function (t) {
    return '<div class="team t' + t + '"><h3>チーム' + t + '（' + pick[t].length + '人）</h3>' + pick[t].map(function (id) {
      return '<span class="chip">' + esc(P(id).name) + ' ' + P(id).rating + '<button class="mini" data-unpick="' + esc(id) + '" aria-label="外す">×</button></span>';
    }).join('') + '</div>';
  }).join('') + '</div>';

  var foot = startOpts.scoring === 'throws' ? '<p class="muted" style="margin:4px 0 0;text-align:right"><a href="#" data-opt="scoring" data-v="manual" style="color:var(--muted);font-weight:400">予備: 結果だけ入力で始める</a></p>' : '';
  var canStart = pick[1].length && pick[2].length;
  h += '<div class="startrow">' + (startOpts.scoring === 'throws'
      ? '<button class="btn" id="nextStep"' + (canStart ? '' : ' disabled') + '>次へ<small>投擲順・先攻を決める</small></button>'
      : '<button class="btn" id="startBtn"' + (canStart ? '' : ' disabled') + '>試合開始</button>') + '<button class="btn ghost" id="clearBtn">クリア</button></div>' + foot;
  h += '<input type="search" id="filter" placeholder="名前で絞り込み" value="' + esc(filter) + '" style="width:100%;margin-bottom:8px">';
  h += '<div class="plist">';
  var picked = {}; pick[1].concat(pick[2]).forEach(function (id) { picked[id] = 1; });
  S.players.filter(function (p) { return p.active && (!filter || p.name.indexOf(filter) >= 0); })
    .sort(function (a, b) { return a.name.localeCompare(b.name, 'ja'); })
    .forEach(function (p) {
      var off = busy[p.id] || picked[p.id];
      h += '<div class="pitem' + (off ? ' off' : '') + '"><span>' + esc(p.name) + ' <span class="muted">' + p.rating + (p.fixed ? '固定' : '') + (busy[p.id] ? ' 試合中' : '') + '</span></span>' +
        (off ? '' : '<span class="pick"><button class="b1" data-pick="1" data-id="' + esc(p.id) + '"' + (pick[1].length >= max ? ' disabled' : '') + '>1</button><button class="b2" data-pick="2" data-id="' + esc(p.id) + '"' + (pick[2].length >= max ? ' disabled' : '') + '>2</button></span>') + '</div>';
    });

}

function startPreview() {
  var s = S.settings;
  if (!(pick[1].length && pick[2].length)) return '';
  var a1 = teamAvg(pick[1]), a2 = teamAvg(pick[2]);

// st: molkkyReplay の結果、m: 試合（team1/team2/use_order）、leg: 表示するセット
function scoreTable(st, m, leg, live) {

  var cols = [first, 3 - first], rows = [];
  L.forEach(function (r) { if (r.team === first || !rows.length) rows.push({}); rows[rows.length - 1][r.team] = r; });
  var teamIds = function (t) { return t === 1 ? m.team1 : m.team2; };
  var showWho = function (t) { return m.use_order && teamIds(t).length > 1; };

  }).join('') + '</tr><tr><th>ターン</th>' + cols.map(function () { return '<th>得点</th><th>合計</th>'; }).join('') + '</tr></thead><tbody>';
  if (!rows.length) h += '<tr><td colspan="5" class="muted">まだ投げていません</td></tr>';
  rows.forEach(function (row, i) {

      var who = showWho(t) && r.player ? '<small>' + esc(P(r.player).name) + '</small>' : '';
      var c = r.event === 'win' ? 'c-win' : r.event === 'out' ? 'c-out' : r.event === 'bust' ? 'c-bust' : r.kind !== 'normal' ? (r.miss_streak >= 2 ? 'c-m2' : 'c-m1') : 'c-ok';

}
function adminRow(m) {
  return '<div class="match"><div>' + names(m.team1) + ' <b>' + (m.status === 'done' ? m.legs1 + '-' + m.legs2 : m.status === 'void' ? '無効' : '試合中') + '</b> ' + names(m.team2) + '</div><div class="meta">' + esc(m.id) + '　' + fmt(m.started_at) + (m.note ? '　' + esc(m.note) : '') + '</div><div class="row" style="margin-top:6px">' +
    (m.status !== 'void' ? '<button class="btn small danger" data-void="' + esc(m.id) + '">無効にする</button>' : '<button class="btn small ghost" data-restore="' + esc(m.id) + '">元に戻す</button>') + '</div></div>';
}

/* ---- イベント ---- */
document.getElementById('adminBtn').addEventListener('click', function () { scoreView = null; tab = 'admin'; render(); window.scrollTo(0, 0); });
document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { scoreView = null; tab = b.dataset.tab; render(); } });
document.getElementById('main').addEventListener('toggle', function (e) { var k = e.target.dataset && e.target.dataset.sec; if (k) store('kamo_sec_' + k, e.target.open ? '1' : '0'); }, true);
document.getElementById('main').addEventListener('input', function (e) { if (e.target.id === 'meFilter') { meFilter = e.target.value; var p0 = e.target.selectionStart; render(); var f0 = document.getElementById('meFilter'); f0.focus(); f0.setSelectionRange(p0, p0); return; } if (e.target.id === 'filter') { filter = e.target.value; var pos = e.target.selectionStart; render(); var f = document.getElementById('filter'); f.focus(); f.setSelectionRange(pos, pos); } });
document.getElementById('main').addEventListener('change', function (e) { if (e.target.id === 'meView') { meView = e.target.value; meAllMatches = false; store('kamo_view', meView); render(); } });
document.getElementById('main').addEventListener('click', function (e) {
  var scl = e.target.closest('[data-scleg]');
  if (scl) { var lc = LC[scoringId]; scoreSel = { mid: scoringId, leg: Number(scl.dataset.scleg), len: lc ? lc.throws.length : 0 }; render(); return; }
  var sct = e.target.closest('[data-sct]');
  if (sct) { e.preventDefault(); openScore(sct.dataset.sct); return; }
  if (e.target.closest('[data-scback]')) { closeScore(); return; }
  var t = e.target.closest('[data-pick],[data-unpick],[data-up],[data-opt],[data-score],[data-manual],[data-pt],#okThrow,[data-dfirst],[data-dup],[data-result],[data-cancel],[data-void],[data-restore],[data-me],[data-eblist],#meAll,#noOrder,#nextStep,#backStep,#startBtn,#clearBtn,#adminLogin,#adminRecalc,#missThrow,#undoThrow,#confirmEnd,#legStart,#closeScore,#forceMine,#reloadServer');
  if (!t) return;
  if (t.id !== 'noOrder') e.preventDefault();
  var d = t.dataset;
  if (t.id === 'noOrder') { startOpts.use_order = !t.checked; render(); return; }
  if (t.id === 'nextStep') { startStep = 2; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'backStep') { startStep = 1; render(); window.scrollTo(0, 0); return; }
  if (d.opt) { startOpts[d.opt] = d.opt === 'first_team' ? Number(d.v) : d.v; render(); return; }
  if (d.up) { var arr = pick[d.team], i = arr.indexOf(d.up); if (i > 0) { arr.splice(i, 1); arr.splice(i - 1, 0, d.up); } render(); return; }
  if (d.score) { openScoring(d.score); return; }
  if (d.manual) { manualOpen[d.manual] = !manualOpen[d.manual]; render(); return; }
  if (d.pt) { var lp = LC[scoringId], v = Number(d.pt); lp.selPt = lp.selPt === v ? null : v; render(); return; }
  if (t.id === 'okThrow') { var lo = LC[scoringId]; if (lo.selPt) addThrow('normal', lo.selPt); return; }
  if (t.id === 'missThrow') { addThrow('miss'); return; }
  if (t.id === 'undoThrow') { undoThrow(); return; }
  if (t.id === 'confirmEnd') { LC[scoringId].confirmEnd = true; LC[scoringId].ver++; lcSave(scoringId); queueSync(true); render(); return; }
  if (d.dfirst) { LC[scoringId].draft.first = Number(d.dfirst); render(); return; }
  if (d.dup) { var dl = LC[scoringId].draft.o[d.team - 1], di = dl.indexOf(d.dup); if (di > 0) { dl.splice(di, 1); dl.splice(di - 1, 0, d.dup); } render(); return; }
  if (t.id === 'legStart') {
    var lg = LC[scoringId], dr = lg.draft, mm0 = findM(scoringId);
    if (mm0.use_order) { while (lg.leg_orders.length < dr.leg - 1) lg.leg_orders.push(null); lg.leg_orders[dr.leg - 1] = [dr.o[0].slice(), dr.o[1].slice()]; }
    if (dr.leg === 3 && dr.first) lg.leg3_first = dr.first;
    lg.draft = null; changed(); return;
  }
  if (t.id === 'closeScore') { scoringId = null; render(); return; }
  if (t.id === 'forceMine') { var lf = LC[scoringId]; lf.conflict = null; lf.takeover = true; lf.ver++; lcSave(scoringId); queueSync(true); render(); return; }
  if (t.id === 'reloadServer') { var rid = scoringId; lcDrop(rid); call('state').then(function (dd) { S = dd; openScoring(rid); }); return; }
  if (d.pick) { pick[d.pick].push(d.id); render(); return; }
  if (d.unpick) { pick[1] = pick[1].filter(function (x) { return x !== d.unpick; }); pick[2] = pick[2].filter(function (x) { return x !== d.unpick; }); render(); return; }
  if (t.id === 'meAll') { meAllMatches = !meAllMatches; render(); return; }
  if (d.eblist) { var lk = meView + ':' + d.eblist; listOpen[lk] = !listOpen[lk]; render(); return; }
  if (d.me) { meView = d.me; tab = 'me'; render(); window.scrollTo(0, 0); return; }
  if (t.id === 'clearBtn') { pick = { 1: [], 2: [] }; startOpts.first_team = null; render(); return; }
  if (t.id === 'startBtn') { t.disabled = true; startSending++; showSendNotice(); var opts = { team1: pick[1], team2: pick[2], scoring: startOpts.scoring, use_order: startOpts.scoring === 'throws' && (startOpts.use_order || (pick[1].length === 1 && pick[2].length === 1)), first_team: startOpts.first_team };
    act('start', opts, '試合を開始しました').then(function (ok) {
      startSending--; showSendNotice();
      if (!ok) return;
      pick = { 1: [], 2: [] }; startOpts = { scoring: 'throws', use_order: true, first_team: null }; startStep = 1;
      if (opts.scoring === 'throws') { var nm = S.matches.filter(function (x) { return x.status === 'playing' && x.started_by === '端末' + deviceId(); })[0]; if (nm) { openScoring(nm.id); return; } }
      render();
    }); return; }
  if (d.result) {
    var box = t.closest('.match'), v = function (f) { return box.querySelector('[data-f=' + f + ']').value; };
    t.disabled = true; manualSending++; showSendNotice();
    act('result', { match_id: d.result, team1_legs: v('legs1'), team2_legs: v('legs2'), team1_score: v('score1'), team2_score: v('score2') }, '結果を記録しました').then(function () { t.disabled = false; manualSending--; render(); });
    return;
  }
  if (d.cancel) { if (t.dataset.sure) { act('cancel', { match_id: d.cancel }, '取り消しました'); } else { t.dataset.sure = 1; t.textContent = 'もう一度押すと取り消し'; } return; }
  if (t.id === 'adminLogin') { var k = document.getElementById('adminKey').value; call('adminCheck', { admin_key: k }).then(function () { adminKey = k; render(); }).catch(function (er) { toast(er.message || er, true); }); return; }
  if (t.id === 'adminRecalc') { act('adminRecalc', { admin_key: adminKey }, '再計算しました'); return; }
  if (d.void) { if (t.dataset.sure) act('adminVoid', { admin_key: adminKey, match_id: d.void, note: '運営が無効化' }, '無効にしました'); else { t.dataset.sure = 1; t.textContent = 'もう一度押すと無効'; } return; }
  if (d.restore) { act('adminRestore', { admin_key: adminKey, match_id: d.restore }, '元に戻しました'); return; }
});

load();
setInterval(function () {
  if (document.visibilityState !== 'visible' || syncing) return;
  if (scoringId && LC[scoringId] && LC[scoringId].ver > LC[scoringId].sentVer) { queueSync(true); return; } // 未送信があれば再送
  if (scoringId || document.activeElement.matches('input,select')) return; // 入力中は画面を書き換えない
  call('state').then(function (d) { S = d; render(); }).catch(function () {});
}, 30000);
</script>
</body>
