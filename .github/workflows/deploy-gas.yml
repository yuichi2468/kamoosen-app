# main に変更が入ったら、テストを通してから Google Apps Script に自動で反映する
name: GASへ反映・画面を公開

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub の「Actions」画面から手動でも実行できる

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: テスト
        run: node test/test.js

      - name: 設定の確認
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$GAS_SCRIPT_ID" ]; then
            echo "::warning::CLASPRC_JSON / GAS_SCRIPT_ID が未設定なので、GASへの反映はスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apps Script に反映（clasp push）
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          # GAS に送るのはこの3つだけ（テストや設計書は送らない）
          mkdir -p build
          cp Code.gs index.html appsscript.json build/
          printf '{"scriptId":"%s","rootDir":"build"}' "$GAS_SCRIPT_ID" > .clasp.json
          clasp push --force

      - name: Webアプリを新バージョンに更新（URLはそのまま）
        if: steps.check.outputs.ready == 'true'
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo "::warning::GAS_DEPLOYMENT_ID が未設定なので、コードの反映だけ行いました（公開URLの更新は手動）"
            exit 0
          fi
          DESC="$(git log -1 --format='%h %s' | cut -c1-90)"
          clasp deploy --deploymentId "$GAS_DEPLOYMENT_ID" --description "$DESC"

  # 画面（index.html）を GitHub Pages で公開する。
  # GAS の画面だと上に「Google Apps Script のユーザーによって作成…」の注意書きが出るため、
  # 画面は GitHub Pages から配り、GAS はデータのやり取り（API）だけに使う。
  pages:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 公開する画面を作る（GAS の URL を書き込む）
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          if [ -z "$GAS_DEPLOYMENT_ID" ]; then
            echo "::error::GAS_DEPLOYMENT_ID が未設定なので、画面がデータの取得先を知ることができません"
            exit 1
          fi
          mkdir -p site
          API="https://script.google.com/macros/s/${GAS_DEPLOYMENT_ID}/exec"
          sed "s#^var API_URL = '';#var API_URL = '${API}';#" index.html > site/index.html
          grep -q "^var API_URL = 'https://script.google.com/" site/index.html || { echo "::error::index.html の API_URL 行が見つかりません"; exit 1; }
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: GitHub Pages に公開
        id: deployment
        uses: actions/deploy-pages@v4
